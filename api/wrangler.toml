name = "bsb-api"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Production URL: https://bsb-api.dpshade.workers.dev
# Arweave permanent origin (deferred): api_bsb undername on "scripture" ArNS name.
# Gateway URL when deployed: https://api_bsb.scripture.ar-io.dev
# The ARWEAVE_ORIGIN env var can override the base URL (without trailing slash).
# In local dev, set it via .dev.vars or the [env.dev] table below.

# R2 persistent cache bucket. Pre-seeded at build time by CI with all JSON files
# from output/dataset/, using the v1/ key structure (see scripts/seed-r2-local.mjs).
# In local dev, `wrangler r2 object put --local` writes to a per-bucket store
# under .wrangler/state/v3/r2/<bucket_name>/, so we omit preview_bucket_name to
# keep dev (preview) and prod using the same local bucket name and seed.
[[r2_buckets]]
binding = "BSB_DATASET"
bucket_name = "bsb-dataset"

# Non-secret environment variables. Secrets (DEPLOY_KEY, ARNS_KEY,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are NOT defined here; they are
# injected at deploy time by the CI workflow (M3).
[vars]
WORKER_VERSION = "1.0.0"
ARWEAVE_ORIGIN = "https://api_bsb.scripture.ar-io.dev"
# ArNS deployment identifiers (informational; referenced by deploy workflow).
ARNS_NAME = "scripture"
ARNS_UNDERNAME = "api_bsb"
